<!DOCTYPE html>
<!--
  NAC — QUOTE PRESENTATION
  The content library behind every customer proposal.

  Everything on this screen is content NAC controls: its own copy, its own
  photographs, other people's reviews that other people agreed to. Nothing here
  can change a price, a load, an airflow or a design — this screen never sees
  them. That separation is deliberate: presentation editing must not be able to
  move an engineering number.

  Approval is always a human act. Nothing uploaded or typed here is publishable
  until somebody ticks Approved, and the preview shows exactly what a customer
  would see with the current approvals applied.
-->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote Presentation — NAC</title>
<style>
:root{
  --navy:#16204A;--navy-2:#202C61;--ink:#161A27;--body:#3D4458;--muted:#6B7285;
  --gold:#F5C200;--gold-d:#C79C00;--line:#E4E7EF;--soft:#F6F8FC;--ok:#1E7A46;--bad:#B3261E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--body);background:var(--soft);line-height:1.55;font-size:15px}
header{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:18px 20px}
header .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:19px;color:var(--gold);letter-spacing:.01em}
header .sub{font-size:13px;color:rgba(255,255,255,.7);flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 80px;display:grid;gap:18px}
@media(min-width:1000px){.wrap{grid-template-columns:210px 1fr}}
nav{align-self:start;position:sticky;top:14px}
nav ul{list-style:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
@media(min-width:1000px){nav ul{flex-direction:column;overflow:visible}}
nav button{width:100%;text-align:left;background:none;border:none;font:inherit;cursor:pointer;
  padding:10px 12px;border-radius:9px;color:var(--muted);font-weight:600;white-space:nowrap;min-height:44px}
nav button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(22,32,74,.1)}
section.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:none}
section.panel.on{display:block}
h2{font-size:18px;color:var(--ink);margin-bottom:6px}
.hint{font-size:13.5px;color:var(--muted);margin-bottom:18px;max-width:72ch}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-weight:650;color:var(--ink);font-size:13.5px;margin-bottom:5px}
input[type=text],input[type=number],input[type=url],textarea,select{
  width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:9px;background:#fff;color:var(--ink);min-height:44px}
textarea{min-height:90px;resize:vertical;line-height:1.55}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none;border-color:var(--navy)}
.grid2{display:grid;gap:14px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;
  padding:10px 18px;border-radius:9px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--navy)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#241C00}
.btn.danger{color:var(--bad);border-color:#F0D2CF}
.btn:disabled{opacity:.5;cursor:default}
.row{border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:12px;background:#fff}
.row.blocked{border-color:#F0D2CF;background:#FFFBFA}
.rowhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rowhead strong{font-size:15px;color:var(--ink)}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:#EAF6EF;border-color:#CBE7D7;color:var(--ok)}
.pill.no{background:#FDECEA;border-color:#F5CFC9;color:var(--bad)}
.why{font-size:12.5px;color:var(--bad);margin-top:8px}
.spacer{flex:1}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thumb{width:74px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line);
  background:var(--soft);flex:0 0 auto}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);
  cursor:pointer;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--navy)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding:10px 20px;backdrop-filter:blur(10px);z-index:20}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.status{font-size:13.5px;color:var(--muted);flex:1;min-width:140px}
.status.err{color:var(--bad);font-weight:600}
.status.ok{color:var(--ok);font-weight:600}
.preview{display:grid;gap:14px}
.pvbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;
  margin:0 auto;width:100%;transition:width .18s}
.frame iframe{width:100%;height:78vh;border:0;display:block}
.note{font-size:13px;color:var(--muted);padding-left:12px;border-left:3px solid var(--line);margin-top:12px}
</style>
</head>
<body>
<header><div class="in">
  <h1>Quote Presentation</h1>
  <span class="sub">Content library for every customer proposal. Nothing here changes a price or a design.</span>
  <a class="btn" href="/admin.html">Back to admin</a>
</div></header>

<div class="wrap">
  <nav><ul id="tabs"></ul></nav>
  <div id="panels"></div>
</div>

<div class="bar"><div class="in">
  <span class="status" id="status">Loading…</span>
  <button class="btn" id="reload">Discard changes</button>
  <button class="btn primary" id="save" disabled>Save library</button>
</div></div>

<script type="module">
import {
  normaliseReview, reviewPublishable, normaliseInstallation, installationPublishable,
  normaliseImageAsset, imagePublishable, normaliseTrust, normaliseUpgrade,
  PERMISSION, CONSENT, REVIEW_SOURCES, INCLUSION_CATALOGUE
} from '/designer/engines/presentation-content.mjs';
import { makeDerivatives, scanMetadata } from '/designer/engines/image-privacy.mjs';
import { buildPresentation } from '/designer/engines/presentation.mjs';
import { renderPresentationHtml } from '/designer/ui/presentation-html.mjs';

const SECTIONS = [
  ['branding',     'Branding'],
  ['about',        'About NAC'],
  ['licences',     'Licences and warranties'],
  ['reviews',      'Reviews'],
  ['installs',     'Past installations'],
  ['images',       'Product images'],
  ['inclusions',   'Included-service cards'],
  ['upgrades',     'Optional upgrades'],
  ['payment',      'Payment terms'],
  ['validity',     'Quote validity'],
  ['terms',        'Terms and conditions'],
  ['email',        'Email introduction'],
  ['templates',    'Quote templates'],
  ['preview',      'Preview']
];

let C = null;                 // the working copy of the library
let dirty = false;

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.appendChild(c);
  return n;
};
const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);

function setStatus(msg, kind = '') {
  const s = $('#status'); s.textContent = msg; s.className = 'status ' + kind;
}
function markDirty() { dirty = true; $('#save').disabled = false; setStatus('Unsaved changes'); }

// ── shell ───────────────────────────────────────────────────────────────────
const tabs = $('#tabs'), panels = $('#panels');
for (const [id, label] of SECTIONS) {
  tabs.appendChild(el('li', {}, [el('button', { text: label, 'data-tab': id,
    onclick: () => showTab(id) })]));
  panels.appendChild(el('section', { class: 'panel', id: 'p-' + id }));
}
function showTab(id) {
  for (const b of tabs.querySelectorAll('button')) b.classList.toggle('on', b.dataset.tab === id);
  for (const p of panels.querySelectorAll('.panel')) p.classList.toggle('on', p.id === 'p-' + id);
  if (id === 'preview') renderPreview();
}

// ── load / save ─────────────────────────────────────────────────────────────
async function load() {
  setStatus('Loading…');
  try {
    const r = await fetch('/api/presentation-content');
    const j = await r.json();
    C = normalise(j.content || {});
  } catch {
    C = normalise({});
    setStatus('Could not reach the server — editing a local copy. Saving will retry.', 'err');
  }
  dirty = false; $('#save').disabled = true;
  drawAll();
  if (!$('#status').classList.contains('err')) setStatus('Loaded');
}
function normalise(c) {
  return {
    logo: c.logo || null,
    heroImage: c.heroImage || null,
    trust: normaliseTrust(c.trust || {}),
    reviews: (c.reviews || []).map(normaliseReview),
    installations: (c.installations || []).map(normaliseInstallation),
    images: (c.images || []).map(normaliseImageAsset),
    upgrades: (c.upgrades || []).map(normaliseUpgrade),
    standardInclusions: c.standardInclusions || {},
    paymentTerms: c.paymentTerms || { stages: [] },
    aftercare: c.aftercare || {},
    termsAndConditions: c.termsAndConditions || '',
    emailIntro: c.emailIntro || '',
    intro: c.intro || '',
    sectionOrder: c.sectionOrder || [],
    hiddenSections: c.hiddenSections || []
  };
}
$('#save').addEventListener('click', async () => {
  $('#save').disabled = true; setStatus('Saving…');
  try {
    const r = await fetch('/api/presentation-content', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: C })
    });
    if (!r.ok) throw new Error();
    dirty = false; setStatus('Saved', 'ok');
  } catch {
    $('#save').disabled = false;
    setStatus('Save failed. Nothing was changed on the server.', 'err');
  }
});
$('#reload').addEventListener('click', () => {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  load();
});
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// ── generic field helpers ───────────────────────────────────────────────────
function field(label, value, onInput, { type = 'text', hint = '', rows = 0 } = {}) {
  const input = rows
    ? el('textarea', { rows: String(rows) })
    : el('input', { type });
  input.value = value ?? '';
  input.addEventListener('input', () => { onInput(input.value); markDirty(); });
  return el('label', { class: 'f' }, [
    el('span', { text: label }), input,
    hint ? el('div', { class: 'note', text: hint }) : null
  ]);
}
function toggle(label, checked, onChange) {
  const i = el('input', { type: 'checkbox' });
  i.checked = !!checked;
  i.addEventListener('change', () => { onChange(i.checked); markDirty(); drawAll(); });
  return el('label', { class: 'chk' }, [i, el('span', { text: label })]);
}
function selectField(label, value, options, onChange) {
  const s = el('select');
  for (const [v, t] of options) {
    const o = el('option', { value: v, text: t });
    if (v === value) o.selected = true;
    s.appendChild(o);
  }
  s.addEventListener('change', () => { onChange(s.value); markDirty(); drawAll(); });
  return el('label', { class: 'f' }, [el('span', { text: label }), s]);
}
function tagsField(label, tags, onChange) {
  return field(label, (tags || []).join(', '),
    v => onChange(v.split(',').map(t => t.trim()).filter(Boolean)),
    { hint: 'Comma separated. Used to match content to a job — e.g. ducted, daikin, new build.' });
}

// ── panels ──────────────────────────────────────────────────────────────────
function drawAll() {
  drawBranding(); drawAbout(); drawLicences(); drawReviews(); drawInstalls();
  drawImages(); drawInclusions(); drawUpgrades(); drawPayment(); drawValidity();
  drawTerms(); drawEmail(); drawTemplates();
}

function panel(id, title, hint, kids) {
  const p = $('#p-' + id);
  p.innerHTML = '';
  p.appendChild(el('h2', { text: title }));
  if (hint) p.appendChild(el('div', { class: 'hint', text: hint }));
  for (const k of [].concat(kids)) if (k) p.appendChild(k);
  return p;
}

function drawBranding() {
  const imgs = [
    el('div', { class: 'rowhead' }, [
      C.logo ? el('img', { class: 'thumb', src: C.logo, alt: 'Current logo' }) : null,
      el('strong', { text: C.logo ? 'Logo set' : 'No logo set' })
    ]),
    uploadButton('Upload logo', async (asset) => {
      C.logo = asset.derivatives[asset.derivatives.length - 1].ref;
      markDirty(); drawAll();
    }, { widths: [400] })
  ];
  const hero = [
    el('div', { class: 'rowhead' }, [
      C.heroImage?.src ? el('img', { class: 'thumb', src: C.heroImage.src, alt: '' }) : null,
      el('strong', { text: C.heroImage ? 'Hero image set' : 'No hero image set' })
    ]),
    uploadButton('Upload hero image', async (asset) => {
      const big = asset.derivatives[asset.derivatives.length - 1];
      C.heroImage = { src: big.ref, alt: asset.alt || 'NAC ducted air conditioning installation',
        width: big.width, height: big.height,
        srcset: asset.derivatives.map(d => ({ ref: d.ref, width: d.width })) };
      markDirty(); drawAll();
    })
  ];
  panel('branding', 'Branding',
    'The logo and hero image every proposal opens with. Images are re-encoded on upload, '
  + 'which is what removes EXIF and GPS data from the copy customers receive.',
    [el('div', { class: 'row' }, imgs), el('div', { class: 'row' }, hero)]);
}

function drawAbout() {
  const t = C.trust;
  const points = el('div');
  (t.points || []).forEach((p, i) => {
    points.appendChild(el('div', { class: 'rowhead' }, [
      (() => {
        const inp = el('input', { type: 'text' }); inp.value = p;
        inp.addEventListener('input', () => { t.points[i] = inp.value; markDirty(); });
        return inp;
      })(),
      el('button', { class: 'btn danger', text: 'Remove',
        onclick: () => { t.points.splice(i, 1); markDirty(); drawAll(); } })
    ]));
  });
  panel('about', 'About NAC',
    'The "Why choose NAC" points. Write only what is true — this section is read by somebody '
  + 'deciding whether to trust NAC with their house.',
    [field('Business name', t.businessName, v => t.businessName = v),
     field('Proposal introduction', C.intro, v => C.intro = v,
       { rows: 4, hint: 'Leave blank to use the standard NAC wording.' }),
     el('h2', { text: 'Trust points' }), points,
     el('button', { class: 'btn', text: '+ Add point',
       onclick: () => { t.points = (t.points || []).concat(['']); markDirty(); drawAll(); } })]);
}

function drawLicences() {
  const t = C.trust;
  panel('licences', 'Licences and warranties',
    'Every field is blank by default and a blank field is left off the proposal. Nothing here '
  + 'is ever filled in with a plausible default — an invented licence number is a fabricated claim.',
    [el('div', { class: 'grid2' }, [
      field('ABN', t.abn, v => t.abn = v),
      field('Electrical contractor licence', t.electricalLicence, v => t.electricalLicence = v),
      field('ARC refrigeration authorisation', t.arcAuthorisation, v => t.arcAuthorisation = v),
      field('Service area', t.serviceArea, v => t.serviceArea = v),
      field('NAC workmanship warranty', t.workmanshipWarranty, v => t.workmanshipWarranty = v),
      field('Manufacturer warranty', t.manufacturerWarranty, v => t.manufacturerWarranty = v),
      field('Insurance statement', t.insuranceStatement, v => t.insuranceStatement = v),
      field('Phone', t.phone, v => t.phone = v),
      field('Email', t.email, v => t.email = v),
      field('Website', t.website, v => t.website = v)
    ]),
    tagsField('Association memberships', t.memberships, v => t.memberships = v),
    el('h2', { text: 'Aftercare' }),
    field('Commissioning', C.aftercare.commissioning, v => C.aftercare.commissioning = v, { rows: 2 }),
    field('Filter care', C.aftercare.filterCare, v => C.aftercare.filterCare = v, { rows: 2 }),
    field('Servicing', C.aftercare.servicing, v => C.aftercare.servicing = v, { rows: 2 }),
    field('Support', C.aftercare.support, v => C.aftercare.support = v, { rows: 2 })]);
}

function drawReviews() {
  const list = el('div');
  C.reviews.forEach((r, i) => {
    const v = reviewPublishable(r);
    list.appendChild(el('div', { class: 'row' + (v.ok ? '' : ' blocked') }, [
      el('div', { class: 'rowhead' }, [
        el('strong', { text: r.displayName || 'Untitled review' }),
        el('span', { class: 'pill ' + (v.ok ? 'ok' : 'no'), text: v.ok ? 'Publishable' : 'Withheld' }),
        r.featured ? el('span', { class: 'pill', text: 'Featured' }) : null,
        el('span', { class: 'spacer' }),
        el('button', { class: 'btn', text: '↑', onclick: () => move(C.reviews, i, -1) }),
        el('button', { class: 'btn', text: '↓', onclick: () => move(C.reviews, i, 1) }),
        el('button', { class: 'btn danger', text: 'Delete', onclick: () => del(C.reviews, i) })
      ]),
      field('Review text — reproduce exactly as written', r.text, x => r.text = x, { rows: 4 }),
      el('div', { class: 'grid2' }, [
        field('Display name', r.displayName, x => r.displayName = x),
        field('Suburb', r.suburb, x => r.suburb = x),
        field('Star rating (1–5)', r.rating, x => r.rating = Number(x), { type: 'number' }),
        field('Review date', r.reviewDate, x => r.reviewDate = x),
        selectField('Source', r.source, REVIEW_SOURCES.map(s => [s, s]), x => r.source = x),
        field('Source URL', r.sourceUrl, x => r.sourceUrl = x, { type: 'url' })
      ]),
      selectField('Permission', r.permissionStatus, [
        [PERMISSION.NONE, 'No permission on file — cannot be published'],
        [PERMISSION.PUBLIC_SOURCE, 'Already published publicly by the reviewer'],
        [PERMISSION.WRITTEN, 'Customer gave NAC permission']
      ], x => r.permissionStatus = x),
      tagsField('Tags', r.tags, x => r.tags = x),
      el('div', { class: 'tools' }, [
        toggle('Approved for marketing', r.approved, x => r.approved = x),
        toggle('Show surname in full', r.surnameApproved, x => r.surnameApproved = x),
        toggle('Featured', r.featured, x => r.featured = x)
      ]),
      v.ok ? null : el('div', { class: 'why', text: 'Withheld: ' + v.reasons.join(' ') })
    ]));
  });
  panel('reviews', 'Reviews',
    'Enter reviews exactly as the customer wrote them. Never reword, shorten or improve one. '
  + 'A review is only shown when it is approved AND a permission or public source is recorded.',
    [list, el('button', { class: 'btn primary', text: '+ Add review', onclick: () => {
      C.reviews.push(normaliseReview({ id: uid('rev'), rating: 5,
        addedAt: new Date().toISOString() }));
      markDirty(); drawAll();
    } })]);
}

function drawInstalls() {
  const byId = Object.fromEntries(C.images.map(i => [i.id, i]));
  const list = el('div');
  C.installations.forEach((n, i) => {
    const v = installationPublishable(n, byId);
    const cover = byId[n.coverImageId];
    list.appendChild(el('div', { class: 'row' + (v.ok ? '' : ' blocked') }, [
      el('div', { class: 'rowhead' }, [
        cover && cover.derivatives?.[0] ? el('img', { class: 'thumb',
          src: cover.derivatives[0].ref, alt: '' }) : null,
        el('strong', { text: n.suburb || 'Untitled installation' }),
        el('span', { class: 'pill ' + (v.ok ? 'ok' : 'no'), text: v.ok ? 'Publishable' : 'Withheld' }),
        el('span', { class: 'spacer' }),
        el('button', { class: 'btn', text: '↑', onclick: () => move(C.installations, i, -1) }),
        el('button', { class: 'btn', text: '↓', onclick: () => move(C.installations, i, 1) }),
        el('button', { class: 'btn danger', text: 'Delete', onclick: () => del(C.installations, i) })
      ]),
      el('div', { class: 'grid2' }, [
        field('Suburb', n.suburb, x => n.suburb = x),
        field('System brand', n.brand, x => n.brand = x),
        field('System type', n.systemType, x => n.systemType = x),
        field('Capacity (kW)', n.capacityKw, x => n.capacityKw = Number(x), { type: 'number' }),
        field('Zones', n.zoneCount, x => n.zoneCount = Number(x), { type: 'number' }),
        field('Completed', n.completedDate, x => n.completedDate = x)
      ]),
      field('Short description', n.description, x => n.description = x, { rows: 2 }),
      selectField('Cover image', n.coverImageId || '',
        [['', '— none —']].concat(C.images.map(im => [im.id, im.alt || im.id])),
        x => n.coverImageId = x || null),
      selectField('Customer consent', n.consentStatus, [
        [CONSENT.NONE, 'No consent on file — cannot be published'],
        [CONSENT.SUBURB_ONLY, 'Suburb may be shown'],
        [CONSENT.GRANTED, 'Street address may be shown']
      ], x => n.consentStatus = x),
      tagsField('Tags', n.tags, x => n.tags = x),
      el('div', { class: 'tools' }, [
        toggle('Approved for marketing', n.approved, x => n.approved = x),
        toggle('Featured', n.featured, x => n.featured = x)
      ]),
      v.ok ? null : el('div', { class: 'why', text: 'Withheld: ' + v.reasons.join(' ') })
    ]));
  });
  panel('installs', 'Past installations',
    'Only jobs whose customer agreed may appear, and only at suburb level unless they agreed '
  + 'to more. Between zero and six show on any one proposal; with none approved the section is '
  + 'hidden rather than padded.',
    [list, el('button', { class: 'btn primary', text: '+ Add installation', onclick: () => {
      C.installations.push(normaliseInstallation({ id: uid('inst'),
        consentStatus: CONSENT.SUBURB_ONLY }));
      markDirty(); drawAll();
    } })]);
}

function drawImages() {
  const list = el('div');
  C.images.forEach((a, i) => {
    const v = imagePublishable(a);
    list.appendChild(el('div', { class: 'row' + (v.ok ? '' : ' blocked') }, [
      el('div', { class: 'rowhead' }, [
        a.derivatives?.[0] ? el('img', { class: 'thumb', src: a.derivatives[0].ref, alt: '' }) : null,
        el('strong', { text: a.alt || a.id }),
        el('span', { class: 'pill ' + (v.ok ? 'ok' : 'no'), text: v.ok ? 'Publishable' : 'Withheld' }),
        el('span', { class: 'pill ' + (a.exifStripped && a.gpsRemoved ? 'ok' : 'no'),
          text: a.exifStripped && a.gpsRemoved ? 'Metadata removed' : 'Metadata present' }),

      el('div', { class: 'tools' }, [toggle('Approved for marketing', a.approved, x => a.approved = x)]),
      el('div', { class: 'note', text: 'Sizes stored: '
        + (a.derivatives || []).map(d => d.width + 'px').join(', ') }),
      v.ok ? null : el('div', { class: 'why', text: 'Withheld: ' + v.reasons.join(' ') })
    ]));
  });
  panel('images', 'Product and installation images',
    'Uploads are re-encoded into web sizes. The re-encode is what strips EXIF and GPS — the '
  + 'original is never served to a customer. Each copy is scanned afterwards and the result is '
  + 'shown above, so "metadata removed" is a measurement rather than an assumption.',
    [list, uploadButton('+ Upload image', async (asset) => {
      C.images.push(asset); markDirty(); drawAll();
    })]);
}

function uploadButton(label, onAsset, opts = {}) {
  const input = el('input', { type: 'file', accept: 'image/*' });
  input.style.display = 'none';
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    setStatus('Processing image…');
    try {
      const made = await makeDerivatives(file, opts);
      const derivatives = [];
      let clean = true;
      for (const d of made.derivatives) {
        const buf = new Uint8Array(await d.blob.arrayBuffer());
        if (!scanMetadata(buf).clean) clean = false;
        derivatives.push({ ref: await toDataUrl(d.blob), width: d.width, height: d.height,
          format: d.format, bytes: d.bytes });
      }
      const asset = normaliseImageAsset({
        id: uid('img'), alt: '', approved: false, derivatives,
        original: { ref: file.name, width: made.width, height: made.height, bytes: file.size },
        exifStripped: clean, gpsRemoved: clean
      });
      await onAsset(asset);
      setStatus(clean ? 'Image added — metadata removed. Add alt text and approve it.'
                      : 'Image added, but metadata survived the re-encode. It cannot be published.',
                clean ? 'ok' : 'err');
    } catch {
      setStatus('Could not read that image.', 'err');
    }
    input.value = '';
  });
  return el('div', {}, [input,
    el('button', { class: 'btn primary', text: label, onclick: () => input.click() })]);
}
function toDataUrl(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

function move(arr, i, d) {
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  const [x] = arr.splice(i, 1); arr.splice(j, 0, x);
  markDirty(); drawAll();
}
function del(arr, i) {
  if (!confirm('Delete this entry?')) return;
  arr.splice(i, 1); markDirty(); drawAll();
}

const VIEWPORTS = [['Phone', 390], ['Tablet', 820], ['Desktop', 1180], ['Print / PDF', 800]];
let previewWidth = 390, previewPrint = false;

function renderPreview() {
  const p = $('#p-preview');
  p.innerHTML = '';
  p.appendChild(el('h2', { text: 'Preview' }));
  p.appendChild(el('div', { class: 'hint', text:
    'A sample proposal rendered with the current library and the current approvals. The figures '
  + 'are placeholders for preview only — a real proposal always reads its numbers from the job.' }));

  const bar = el('div', { class: 'pvbar' });
  for (const [label, w] of VIEWPORTS) {
    bar.appendChild(el('button', { class: 'btn' + (previewWidth === w
      && previewPrint === (label === 'Print / PDF') ? ' primary' : ''), text: label,
      onclick: () => { previewWidth = w; previewPrint = label === 'Print / PDF'; renderPreview(); } }));
  }
  p.appendChild(bar);

  const built = buildPresentation({
    design: PREVIEW_DESIGN,
    customer: { name: 'Preview Customer', address: '1 Example Street, Peregian Springs QLD 4573' },
    job: { siteAddress: '1 Example Street, Peregian Springs QLD 4573' },
    content: C,
    proposalNumber: 'PREVIEW', preparedAt: new Date().toISOString(),
    expiresAt: new Date(Date.now() + 30 * 86400000).toISOString(),
    revision: 1, status: 'issued',
    heroImage: C.heroImage || null
  });
  if (!built.ok) {
    p.appendChild(el('div', { class: 'why',
      text: 'Preview unavailable: ' + built.blockers.map(b => b.message).join(' ') }));
    return;
  }
  const frame = el('div', { class: 'frame' });
  frame.style.width = Math.min(previewWidth, 1180) + 'px';
  frame.style.maxWidth = '100%';
  // allow-same-origin only: the proposal's own script is not needed to judge
  // the design, and a preview should not be able to run anything.
  const iframe = el('iframe', { title: 'Proposal preview', sandbox: 'allow-same-origin' });
  frame.appendChild(iframe);
  p.appendChild(el('div', { class: 'preview' }, [frame]));
  iframe.srcdoc = renderPresentationHtml(built.presentation, previewPrint ? { mode: 'print' } : {});
}
