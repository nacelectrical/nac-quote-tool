<!DOCTYPE html>
<!--
  NAC — QUOTES

  Nick: "Also need to have the spot for our quotes to be saved in the portal."

  They were always being saved. nac_quote_issues has held every issued quote
  since quotes could be issued at all. What there was no way to do was LOOK at
  them: who had been sent one, who had opened it, who had accepted, at what
  price, and whether the ServiceM8 job came through.

  NAC staff only. Every row is a customer's name, their address and the price
  they were quoted, and the link itself is a bearer credential — so this page
  is behind the same sign-in as the rest of the internal screens, and the
  endpoint behind it refuses anyone who is not signed in.
-->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quotes — NAC</title>
<style>
:root{
  --navy:#16204A;--navy-2:#202C61;--ink:#161A27;--body:#3D4458;--muted:#6B7285;
  --gold:#F5C200;--gold-d:#C79C00;--line:#E4E7EF;--soft:#F6F8FC;--ok:#1E7A46;--bad:#B3261E;
  --warn:#9A6B00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--body);background:var(--soft);line-height:1.55;font-size:15px}
header{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:18px 20px}
header .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:19px;color:var(--gold)}
header .sub{font-size:13px;color:rgba(255,255,255,.7);flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 80px;display:grid;gap:16px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{display:block;font-size:26px;color:var(--ink);line-height:1.15}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert{border-color:var(--warn);background:#FFFBF0}
.stat.alert b{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;
  padding:10px 15px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;
  align-items:center;gap:7px}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary{background:var(--gold);border-color:var(--gold-d);font-weight:700}
.note{font-size:13.5px;color:var(--muted)}
.q{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;display:grid;
  gap:10px}
.q.accepted{border-left:4px solid var(--ok)}
.q.declined,.q.revoked{border-left:4px solid var(--bad)}
.q.superseded{opacity:.72}
.qh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.qh strong{font-size:17px;color:var(--ink)}
.qh .addr{color:var(--muted);font-size:14px;flex:1;min-width:160px}
.pill{font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:#E7F4EC;color:var(--ok)}
.pill.no{background:#FBECEB;color:var(--bad)}
.pill.warn{background:#FFF4D9;color:var(--warn)}
/* Label ABOVE value, not beside it. Side by side, a long value — "8 Oct 2026
   by nick@nacelectrical.com.au" — wraps across the gap and runs into the next
   column's label, so two facts read as one. */
.facts{display:grid;gap:2px 22px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  font-size:14px}
.facts div{display:flex;flex-direction:column;gap:1px;border-bottom:1px solid var(--line);
  padding:8px 0;min-width:0}
.facts dt{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
.facts dd{font-weight:650;color:var(--ink);overflow-wrap:anywhere}
.qa{display:flex;flex-wrap:wrap;gap:8px}
/* ── THE PODIUM PANEL ──────────────────────────────────────────────────
   Collapsed until it is wanted, because most of the time the estimator is
   reading the list rather than chasing one quote. */
.pod{border:1px solid var(--line);border-radius:11px;background:var(--soft);padding:0}
.pod>summary{cursor:pointer;padding:12px 15px;font-weight:650;color:var(--ink);
  min-height:44px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pod>summary::marker{color:var(--muted)}
.pod .body{padding:0 15px 15px;display:grid;gap:11px}
.pod textarea{font:inherit;width:100%;min-height:190px;border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);line-height:1.5;
  resize:vertical}
.pod .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pod label{font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center}
.pod input[type=text]{font:inherit;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;min-height:44px;background:#fff;color:var(--ink);min-width:150px}
.pod .said{font-size:13.5px;border-radius:9px;padding:10px 12px}
.pod .said.ok{background:#E7F4EC;color:var(--ok)}
.pod .said.bad{background:#FBECEB;color:var(--bad)}
.pod .hist{font-size:13px;color:var(--muted);display:grid;gap:3px}
.link{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--muted);
  overflow-wrap:anywhere}
.empty{background:#fff;border:1px dashed var(--line);border-radius:13px;padding:40px 22px;
  text-align:center;color:var(--muted)}
.err{background:#FBECEB;border:1px solid #F3C9C6;color:var(--bad);border-radius:11px;padding:14px 16px}
@media(max-width:600px){.facts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="in">
  <h1>NAC — Quotes</h1>
  <span class="sub" id="who">Every proposal that has been issued.</span>
  <a class="btn primary" href="/quote-builder.html">New quote</a>
  <a class="btn" href="/quote-presentation.html">Content library</a>
</div></header>

<div class="wrap">
  <div class="cards" id="stats"></div>
  <div class="bar" id="filters"></div>
  <div class="bar" id="sm8"></div>
  <div id="sm8Result"></div>
  <div id="list"><p class="note">Loading…</p></div>
</div>

<script type="module">
import { requireSignIn, currentSession } from '/designer/auth.mjs';

// Customer names, addresses and prices. Same gate as every other NAC screen.
await requireSignIn({ pageName: 'the quote list' });

function staffHeaders(extra = {}) {
  const s = currentSession();
  return { ...extra, ...(s && s.access_token
    ? { Authorization: 'Bearer ' + s.access_token } : {}) };
}

const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.appendChild(c);
  return n;
};

const money = (v) => v === null || v === undefined
  ? '—' : '$' + Number(v).toLocaleString('en-AU', { minimumFractionDigits: 2,
                                                    maximumFractionDigits: 2 });
const when = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-AU',
    { day: 'numeric', month: 'short', year: 'numeric' });
};

let FILTER = 'all';
let DATA = null;

function fact(label, value) {
  return el('div', {}, [el('dt', { text: label }), el('dd', { text: value })]);
}

function card(q) {
  const base = location.origin;
  const url = base + '/quote.html#' + q.token;

  // Said plainly, because "accepted" and "in the calendar" are different facts
  // and the gap between them is the one somebody has to chase.
  let sm8;
  if (q.status !== 'accepted') sm8 = null;
  else if (q.servicem8 && q.servicem8.ok) {
    sm8 = el('span', { class: 'pill ok',
      text: 'ServiceM8 ' + (q.servicem8.jobId ? '#' + q.servicem8.jobId : 'job created') });
  } else {
    sm8 = el('span', { class: 'pill warn', text: 'Not in ServiceM8' });
  }

  const head = el('div', { class: 'qh' }, [
    el('strong', { text: q.customerName || 'Unnamed customer' }),
    el('span', { class: 'addr', text: q.siteAddress || 'No site address recorded' }),
    el('span', { class: 'pill ' + (q.status === 'accepted' ? 'ok'
      : (q.status === 'declined' || q.status === 'revoked') ? 'no' : ''), text: q.status }),
    sm8
  ]);

  const facts = el('div', { class: 'facts' }, [
    fact('Proposal', (q.proposalNumber || '—') + '  ·  rev ' + q.revision),
    fact('Issued', when(q.issuedAt) + (q.issuedBy ? ' by ' + q.issuedBy : '')),
    fact('Opened', q.viewCount ? q.viewCount + '× — last ' + when(q.lastViewedAt) : 'Never opened'),
    fact('Expires', when(q.expiresAt)),
    fact('Quoted', money(q.quotedTotalIncGst)),
    fact(q.status === 'accepted' ? 'Accepted' : 'Accepted total',
      q.acceptedTotalIncGst !== null
        ? money(q.acceptedTotalIncGst) + ' — ' + (q.acceptedBy || 'unnamed')
          + (q.signed ? ' (signed)' : ' (typed name only)')
        : '—'),
    fact('GST', q.gstRate === null ? '—' : (q.gstRate * 100).toFixed(0) + '%'),
    fact('Accepted on', when(q.acceptedAt))
  ]);

  const notes = [];
  if (!q.hasIssuedCopy) {
    notes.push(el('p', { class: 'note',
      text: 'Issued before quotes were stored as a fixed copy, so this link cannot be '
          + 'reopened. Issue a new revision.' }));
  }
  if (q.supersededBy) {
    notes.push(el('p', { class: 'note', text: 'Replaced by a later revision.' }));
  }
  if (q.status === 'accepted' && q.servicem8 && !q.servicem8.ok) {
    notes.push(el('p', { class: 'note',
      text: 'ServiceM8: ' + (q.servicem8.message || q.servicem8.reason)
          + ' The acceptance is recorded either way.' }));
  }
  if (q.status === 'accepted' && !q.servicem8) {
    notes.push(el('p', { class: 'note',
      text: 'No ServiceM8 attempt is recorded against this acceptance — it was accepted '
          + 'before jobs were created automatically.' }));
  }

  return el('div', { class: 'q ' + q.status }, [
    head, facts, ...notes,
    el('div', { class: 'qa' }, [
      el('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener',
                text: 'Open the customer page' }),
      el('button', { class: 'btn', text: 'Copy link', onclick: async (e) => {
        const btn = e.target;
        try { await navigator.clipboard.writeText(url); btn.textContent = 'Copied'; }
        catch (_) { btn.textContent = 'Could not copy'; return; }
        // ── COPIED IS RECORDED AS COPIED ──────────────────────────────
        // Not as sent. The record has to be able to tell the estimator that
        // a link went on a clipboard and nobody ever pasted it.
        await record(q, OUTREACH.LINK_COPIED, (m) => {
          const pill = document.querySelector('[data-pill="' + q.token + '"]');
          const note = document.querySelector('[data-state="' + q.token + '"]');
          const said = document.querySelector('[data-said="' + q.token + '"]');
          const line = outreachLine(q);
          if (pill) { pill.className = 'pill ' + line.kind; pill.textContent = line.pill; }
          if (note) note.textContent = line.text;
          if (said && m) { said.className = 'said ' + (m.kind || ''); said.textContent = m.text; }
        });
        setTimeout(() => { btn.textContent = 'Copy link'; }, 1600);
      } })
    ]),
    el('p', { class: 'link', text: url }),
    podiumPanel(q, url)
  ]);
}

// ── THE PODIUM PANEL ────────────────────────────────────────────────────────
//
// Nick, 4 November 2026: "Support a manual Podium workflow now: copy the quote
// link, provide an editable message that can be pasted into Podium, record that
// a message was sent manually... Clearly distinguish a copied link from a
// message successfully sent."
//
// NOTHING ON THIS PANEL SENDS ANYTHING. There is no Podium request anywhere in
// this application, and the panel says so where somebody can read it rather
// than only in a comment.

/** What this quote's outreach record says, in one line an estimator can act on. */
function outreachLine(q) {
  const o = q.outreach;
  if (!o || o.state === 'none') {
    return { pill: 'Not sent', kind: 'warn',
      text: 'Nothing recorded. Nobody has copied this link or marked it sent.' };
  }
  if (o.state === 'opted_out') {
    return { pill: 'Opted out', kind: 'no',
      text: 'This customer asked not to be followed up. That is not something to resume.' };
  }
  if (o.state === 'link_copied') {
    return { pill: 'Link copied', kind: 'warn',
      text: 'The link was copied on ' + when(o.linkCopiedAt) + ' but nobody has recorded '
        + 'sending it. A copied link is not a sent message — mark it sent once it has gone.' };
  }
  if (o.state === 'customer_replied') {
    return { pill: 'Customer replied', kind: 'ok',
      text: 'The customer wrote back, so follow-up is paused until somebody resumes it.' };
  }
  if (o.state === 'taken_over') {
    return { pill: 'Nick has it', kind: '',
      text: 'Taken over by hand. Follow-up is paused.' };
  }
  return { pill: 'Sent', kind: 'ok',
    text: 'Marked sent on ' + when(o.sentAt) + (o.channel ? ' via ' + o.channel : '')
      + (o.sentBy ? ' by ' + o.sentBy : '')
      + (o.followUpCount ? '. ' + o.followUpCount + ' follow-up(s) recorded.' : '.') };
}

const OUTREACH = {
  LINK_COPIED: 'link_copied', SENT_MANUALLY: 'sent_manually',
  CUSTOMER_REPLIED: 'customer_replied', TAKEN_OVER: 'taken_over',
  OPTED_OUT: 'opted_out', RESUME: 'resume'
};

/**
 * Record what NAC did, and say it ONLY once the database has confirmed it.
 *
 * Nick: "Report success only after the database confirms it was saved." A
 * button that goes green on a request that never landed is the one lie that
 * loses a job — here it would mean a quote marked sent that nobody sent.
 *
 * It refreshes the panel in place rather than redrawing the list, so the
 * estimator does not lose the message they were editing or the panel they had
 * open.
 */
async function record(q, action, refresh, extra = {}) {
  const say = (kind, text) => refresh({ kind, text });
  say('', 'Recording…');
  try {
    const r = await fetch('/api/quote-outreach', {
      method: 'POST', headers: staffHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ token: q.token, action, ...extra })
    });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) {
      say('bad', (out.message || out.error || 'That was not recorded.')
        + ' Nothing has been changed.');
      return false;
    }
    q.outreach = out.outreach;
    say('ok', WORDED[action] || 'Recorded.');
    return true;
  } catch (e) {
    say('bad', 'Not recorded: ' + e.message + '. Nothing has been changed.');
    return false;
  }
}

const WORDED = {
  link_copied: 'Recorded: the link was copied. That is NOT a sent message — '
    + 'mark it sent once it has actually gone.',
  sent_manually: 'Recorded as sent. The follow-up clock starts from now.',
  customer_replied: 'Recorded: the customer replied. Follow-up is paused.',
  taken_over: 'Recorded: you have taken this one over. Follow-up is paused.',
  opted_out: 'Recorded: the customer asked not to be followed up. '
    + 'This one cannot be resumed.',
  resume: 'Follow-up resumed.'
};

function podiumPanel(q, url) {
  const state = outreachLine(q);
  const o = q.outreach || {};
  const first = (q.customerName || '').trim().split(/\s+/)[0] || 'there';
  const site = q.siteAddress ? ' for ' + q.siteAddress : '';

  // The same message the engine composes (designer/engines/podium.mjs), in NAC's
  // voice, with no claim about the job that the proposal does not already make:
  // a message that summarises the offer is a second version of it that nobody
  // is checking.
  const sent = o.state === 'sent_manually' || o.sentAt;
  const message = sent
    ? ['Hi ' + first + ',', '',
       'Just following up the air conditioning proposal we sent through' + site
         + '. The link is still live:', '', url, '',
       'Happy to go through any of it, or change the options if something else would '
         + 'suit you better. No rush either way — just let me know if you have any '
         + 'questions.', '',
       'Thanks,', 'NAC Electrical Air & Refrigeration'].join('\n')
    : ['Hi ' + first + ',', '',
       'Thanks for having us out. Your air conditioning proposal' + site + ' is ready:',
       '', url, '',
       'It has the system, what is included, what is not, and the price. There are a '
         + 'couple of options you can choose between on the page, and you can accept it '
         + 'from there when you are ready.', '',
       'Give me a call if you would like to talk any of it through.', '',
       'Thanks,', 'NAC Electrical Air & Refrigeration'].join('\n');

  const box = el('textarea', { spellcheck: 'true' });
  box.value = message;
  const channel = el('input', { type: 'text', placeholder: 'How it went (Podium SMS, phone…)',
    value: o.channel || 'Podium' });

  const btn = (text, cls, fn, id) => el('button', {
    class: 'btn' + (cls ? ' ' + cls : ''), text, onclick: fn,
    ...(id ? { 'data-act': id } : {}) });

  const pill = el('span', { class: 'pill ' + state.kind, text: state.pill,
    'data-pill': q.token });
  const note = el('p', { class: 'note', text: state.text, 'data-state': q.token });
  const said = el('div', { class: 'said', 'data-said': q.token });
  const hist = el('div', { class: 'hist', 'data-hist': q.token });
  const row = el('div', { class: 'row', 'data-actions': q.token });

  /** Redraw the panel's own state from the record, keeping the message typed. */
  function refresh(message) {
    const now = outreachLine(q);
    const r = q.outreach || {};
    pill.className = 'pill ' + now.kind;
    pill.textContent = now.pill;
    note.textContent = now.text;
    if (message) {
      said.className = 'said ' + (message.kind || '');
      said.textContent = message.text;
    }
    row.textContent = '';
    const acts = [
      btn('Copy the message', '', async (e) => {
        try { await navigator.clipboard.writeText(box.value); e.target.textContent = 'Copied'; }
        catch (_) { e.target.textContent = 'Could not copy'; }
        setTimeout(() => { e.target.textContent = 'Copy the message'; }, 1600);
      }, 'copymsg'),
      btn('I have sent it', 'primary',
        () => record(q, OUTREACH.SENT_MANUALLY, refresh, { channel: channel.value.trim() }),
        'sent')
    ];
    if (r.state !== 'opted_out') {
      if (r.paused) {
        acts.push(btn('Resume follow-up', '',
          () => record(q, OUTREACH.RESUME, refresh), 'resume'));
      } else {
        acts.push(btn('Customer replied', '',
          () => record(q, OUTREACH.CUSTOMER_REPLIED, refresh), 'replied'));
        acts.push(btn('I am handling it', '',
          () => record(q, OUTREACH.TAKEN_OVER, refresh), 'takeover'));
      }
      acts.push(btn('Asked not to be chased', '', () => {
        // Irreversible, so it asks first.
        if (window.confirm('Record that ' + (q.customerName || 'this customer')
          + ' asked not to be followed up? This cannot be undone.')) {
          record(q, OUTREACH.OPTED_OUT, refresh);
        }
      }, 'optout'));
    }
    for (const a of acts) row.appendChild(a);

    hist.textContent = '';
    const events = (q.outreach?.events || []).slice(-6);
    if (events.length) {
      hist.appendChild(el('strong', { text: 'What has been recorded' }));
      for (const e of events) {
        hist.appendChild(el('div', { text: when(e.at) + ' — '
          + (WORDED_SHORT[e.state] || e.state) + (e.by ? ' (' + e.by + ')' : '') }));
      }
    }
  }
  refresh(null);

  return el('details', { class: 'pod', 'data-pod': q.token }, [
    el('summary', {}, [el('span', { text: 'Send through Podium' }), pill]),
    el('div', { class: 'body' }, [
      note,
      el('p', { class: 'note',
        text: 'Nothing is sent from here. Edit the message, copy it, paste it into '
          + 'Podium, then say so below — this application has no Podium connection '
          + 'and schedules nothing.' }),
      box,
      el('div', { class: 'row' }, [el('label', { text: 'Channel' }), channel]),
      row, said, hist
    ])
  ]);
}

const WORDED_SHORT = {
  link_copied: 'link copied', sent_manually: 'marked sent',
  customer_replied: 'customer replied', taken_over: 'taken over by hand',
  opted_out: 'asked not to be chased', resumed: 'follow-up resumed'
};

function draw() {
  const stats = $('#stats'); stats.innerHTML = '';
  const c = DATA.counts;
  const tiles = [
    ['Issued', c.issued, ''], ['Accepted', c.accepted, ''],
    ['Accepted value', money(DATA.acceptedValueIncGst), ''],
    ['Not in ServiceM8', c.notInServiceM8, c.notInServiceM8 > 0 ? 'alert' : '']
  ];
  for (const [label, value, cls] of tiles) {
    // A count the server did not send is a dash, not the word "undefined".
    // A tile reading "undefined" is the screen telling the estimator it does
    // not know, in the one register that looks like a fault in the page.
    const shown = (value === null || value === undefined || value === '')
      ? '—' : String(value);
    stats.appendChild(el('div', { class: 'stat ' + cls }, [
      el('b', { text: shown }), el('span', { text: label })]));
  }

  // ── THE WRITE PATH, CHECKED ON PURPOSE ─────────────────────────────────
  // The selftest is read-only: it proves the key is accepted and jobs can be
  // READ. A read-only key passes all of it and still creates nothing when a
  // customer accepts. This is the only way to know, and it is a button rather
  // than anything automatic because it writes to the live ServiceM8 account.
  const sm8 = $('#sm8'); sm8.innerHTML = '';
  sm8.appendChild(el('button', { class: 'btn', text: 'Test ServiceM8 — create one job',
    onclick: testServiceM8 }));
  sm8.appendChild(el('span', { class: 'note',
    text: 'Creates one job named "ZZ TEST — NAC Quote Tool", through the same code a real '
        + 'acceptance uses. It is a Quote, not a Work Order, so it never looks like won '
        + 'work — delete it afterwards.' }));

  const f = $('#filters'); f.innerHTML = '';
  for (const [key, label] of [['all', 'All'], ['issued', 'Issued'], ['viewed', 'Opened'],
                              ['accepted', 'Accepted'], ['declined', 'Declined'],
                              ['superseded', 'Superseded']]) {
    f.appendChild(el('button', { class: 'btn' + (FILTER === key ? ' on' : ''), text: label,
      onclick: () => { FILTER = key; draw(); } }));
  }
  f.appendChild(el('button', { class: 'btn', text: 'Refresh', onclick: load }));

  const list = $('#list'); list.innerHTML = '';
  const rows = FILTER === 'all' ? DATA.quotes : DATA.quotes.filter(q => q.status === FILTER);
  if (!rows.length) {
    list.appendChild(el('div', { class: 'empty', text: DATA.quotes.length
      ? 'No quotes with that status.'
      : 'No quotes have been issued yet. Issue one from the designer and it appears here.' }));
    return;
  }
  for (const q of rows) list.appendChild(card(q));
}

async function testServiceM8() {
  const box = $('#sm8Result');
  box.innerHTML = '';
  box.appendChild(el('p', { class: 'note', text: 'Asking ServiceM8 to create a job…' }));
  try {
    const r = await fetch('/api/servicem8-testjob', { method: 'POST', headers: staffHeaders() });
    const j = await r.json().catch(() => null);
    box.innerHTML = '';
    if (!j) {
      box.appendChild(el('div', { class: 'err', text: 'No answer from the server.' }));
      return;
    }
    if (j.ok) {
      box.appendChild(el('div', { class: 'q accepted' }, [
        el('div', { class: 'qh' }, [
          el('strong', { text: 'ServiceM8 write path works' }),
          el('span', { class: 'pill ok', text: j.jobId ? 'job #' + j.jobId : 'job created' })
        ]),
        el('p', { class: 'note', text: j.message }),
        el('p', { class: 'note', text: j.cleanup })
      ]));
    } else {
      box.appendChild(el('div', { class: 'err',
        text: (j.message || j.reason || 'The job could not be created.')
            + (j.note ? '  ' + j.note : '') }));
    }
  } catch (e) {
    box.innerHTML = '';
    box.appendChild(el('div', { class: 'err', text: 'Could not reach the server.' }));
  }
}

async function load() {
  const list = $('#list');
  list.innerHTML = '';
  list.appendChild(el('p', { class: 'note', text: 'Loading…' }));
  try {
    const r = await fetch('/api/quote-list?limit=200', { headers: staffHeaders() });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      list.innerHTML = '';
      list.appendChild(el('div', { class: 'err',
        text: (j && (j.message || j.error)) || 'The quote list could not be loaded.' }));
      return;
    }
    DATA = j;
    draw();
  } catch (e) {
    list.innerHTML = '';
    list.appendChild(el('div', { class: 'err',
      text: 'Could not reach the server. Check your connection and try again.' }));
  }
}

const s = currentSession();
if (s && s.user && s.user.email) $('#who').textContent = 'Signed in as ' + s.user.email;
load();
</script>
