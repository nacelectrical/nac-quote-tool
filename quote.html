<!DOCTYPE html>
<!--
  NAC — the customer's quote link.

  Deliberately the thinnest page in the repository. It reads a token from the
  URL fragment, asks the server for the finished presentation, and writes the
  returned HTML into the document. It contains no engines, no design code, no
  pricing, no Supabase client and no application navigation — everything it
  shows was decided server-side, which is why an unauthenticated visitor holding
  a link can see a proposal and nothing else.

  The token is in the FRAGMENT rather than the query string so it is never sent
  in a Referer header, never lands in a server access log, and is not carried
  into any outbound request the page makes.
-->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Your Proposal — NAC Electrical Air &amp; Refrigeration</title>
<style>
  :root{--navy:#16204A;--gold:#F5C200;--muted:#6B7285;--line:#E4E7EF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#fff;color:#161A27;line-height:1.6;-webkit-font-smoothing:antialiased}
  .state{max-width:560px;margin:0 auto;padding:18vh 24px 40px;text-align:center}
  .state h1{font-size:23px;color:var(--navy);margin-bottom:12px;line-height:1.25}
  .state p{color:var(--muted);font-size:16.5px;margin-bottom:22px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--navy);
    border-radius:50%;margin:0 auto 20px;animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}}
  .cta{display:inline-flex;align-items:center;justify-content:center;min-height:52px;
    padding:14px 26px;border-radius:11px;background:var(--gold);color:#241C00;
    font-weight:700;font-size:16.5px;text-decoration:none;border:none;cursor:pointer}
</style>
</head>
<body>
<div id="root">
  <div class="state" id="loading">
    <div class="spin" role="status" aria-label="Loading your proposal"></div>
    <p>Loading your proposal…</p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var root = document.getElementById('root');

  function show(title, message, action) {
    root.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'state';
    var h = document.createElement('h1'); h.textContent = title; wrap.appendChild(h);
    if (message) { var p = document.createElement('p'); p.textContent = message; wrap.appendChild(p); }
    if (action) {
      var a = document.createElement('a');
      a.className = 'cta'; a.href = action.href; a.textContent = action.label;
      wrap.appendChild(a);
    }
    root.appendChild(wrap);
  }

  // base64url, the shape issuePresentation() produces. Anything else is not
  // sent to the server at all.
  var token = (location.hash || '').replace(/^#/, '').trim();
  if (!/^[A-Za-z0-9_-]{22,128}$/.test(token)) {
    show('This link is not valid',
         'Please check the link in your email, or contact us and we will send you a new one.');
    return;
  }

  function render(html) {
    // The server returns a complete document. Replacing the whole document is
    // what gives the proposal its own <head>, styles and scripts rather than
    // inheriting this shell's.
    document.open();
    document.write(html);
    document.close();
  }

  function wire() {
    window.NACQuote = {
      accept: function (payload) {
        respond('accept', payload, function (r) {
          if (r && r.state === 'ok') { location.reload(); return; }
          fail(r && r.message ? r.message
            : 'We could not record your acceptance. Please contact us and we will sort it out.');
        });
      },
      decline: function () {
        if (!window.confirm('Decline this proposal? You can still contact us afterwards.')) return;
        respond('decline', {}, function () { location.reload(); });
      },
      onOptionsChanged: function (ids) {
        respond('options', { selectedOptionIds: ids }, function () { location.reload(); });
      },
      // Only reached when NAC has no phone or email in the content library; the
      // renderer emits a real tel:/mailto: link whenever it has one. Sending the
      // customer to the footer is the honest fallback.
      ask: function () {
        var f = document.querySelector('.foot');
        if (f && f.scrollIntoView) f.scrollIntoView({ behavior: 'smooth' });
      }
    };
  }

  function fail(msg) {
    var err = document.getElementById('acceptErr');
    var btn = document.getElementById('acceptBtn');
    if (btn) { btn.disabled = false; btn.textContent = 'Accept proposal'; }
    if (err) { err.textContent = msg; err.hidden = false; }
    else window.alert(msg);
  }

  function respond(action, payload, done) {
    var body = { token: token, action: action };
    for (var k in payload) if (Object.prototype.hasOwnProperty.call(payload, k)) {
      body[k === 'name' ? 'customerName' : k] = payload[k];
    }
    fetch('/api/quote-respond', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().catch(function () { return null; }); })
      .then(done)
      .catch(function () {
        fail('We could not reach our server. Please check your connection and try again.');
      });
  }

  fetch('/api/quote-view?token=' + encodeURIComponent(token), { headers: { Accept: 'application/json' } })
    .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
    .then(function (res) {
      var b = res.body || {};
      if (b.state === 'superseded') {
        if (b.redirectToken) { location.hash = b.redirectToken; location.reload(); return; }
        show('A newer proposal is available',
             'Please contact us and we will send you the current version.');
        return;
      }
      if (b.state === 'revoked') {
        show('This proposal has been withdrawn',
             b.message || 'Please contact us for a current proposal.');
        return;
      }
      if (b.state === 'blocked' || res.status === 409) {
        show('This proposal is not ready yet',
             'We are finalising a detail on your quote. We will be in touch shortly.');
        return;
      }
      if (res.status === 404) {
        show('This link is not valid',
             'Please check the link in your email, or contact us and we will send you a new one.');
        return;
      }
      if (!b.presentation) {
        show('We could not load your proposal',
             'Please try again in a moment, or contact us and we will send it another way.');
        return;
      }
      // The renderer runs in the page so the markup is built from the view
      // model here, not shipped as a pre-rendered blob from the database.
      import('/designer/ui/presentation-html.mjs')
        // wire() first: document.write() runs the new document's inline script
        // immediately, and that script expects window.NACQuote to already exist.
        .then(function (m) { wire(); render(m.renderPresentationHtml(b.presentation)); })
        .catch(function () {
          show('We could not display your proposal',
               'Please try again, or contact us and we will send you a PDF copy.');
        });
    })
    .catch(function () {
      show('We could not load your proposal',
           'Please check your connection and try again.');
    });
})();
</script>
</body>
</html>
